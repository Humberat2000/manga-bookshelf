<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20242b"><title>我的漫画书架</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="eyebrow">PERSONAL LIBRARY</div><h1>我的漫画书架</h1><p id="status">登录后查看云端收藏</p></header>
<main><section id="auth" class="panel"><h2>账号登录</h2><input id="email" type="email" placeholder="邮箱地址" autocomplete="username"><input id="password" type="password" placeholder="密码" autocomplete="current-password"><div class="actions"><button id="login">登录</button><button id="signup" class="secondary">注册</button></div><p id="message" class="muted">使用电脑扩展中相同的邮箱和密码。</p></section>
<section id="library" hidden><div class="userbar"><span id="userEmail"></span><button id="logout" class="secondary">退出</button></div><div class="toolbar"><input id="search" type="search" placeholder="搜索漫画名称或 ID"><select id="sort"><option value="default">默认顺序</option><option value="title">名称排序</option><option value="id">ID 排序</option></select></div><p id="count" class="count"></p><div id="grid" class="grid"></div><p id="empty" class="empty" hidden>书架目前为空。请先在电脑端漫画网站打开收藏页面进行首次同步。</p></section></main><footer>个人书架 · 收藏数据仅对登录账号开放</footer><script src="config.js"></script><script src="app.js"></script></body></html>
